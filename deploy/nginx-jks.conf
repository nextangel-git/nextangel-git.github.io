# nginx для сайта ЖКС на Beget VPS
# Кладётся в /etc/nginx/sites-available/jks, симлинк в sites-enabled.
# SSL выпускается certbot'ом после того, как DNS укажет на сервер.

# --- сайт (статика из astro build) ---
server {
    listen 80;
    server_name jks.ooo www.jks.ooo;
    root /var/www/jks/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/index.html $uri/ /404/index.html;
    }

    location ~* \.(css|js|svg|png|jpg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# --- админка (Node на 127.0.0.1:4777, наружу не светит) ---
server {
    listen 80;
    server_name admin.jks.ooo;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
