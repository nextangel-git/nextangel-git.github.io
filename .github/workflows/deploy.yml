name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Do not interrupt a multi-file FTPS publication halfway through.
  cancel-in-progress: false

jobs:
  build:
    # The maintained 24.04 runner includes PHP 8.3 for backend syntax/integration checks.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
      - run: npm ci
      - run: npm ci --prefix admin
      - name: Check public PHP backend syntax
        run: |
          php --version
          for file in public/api/*.php; do php -l "$file"; done
          php -l admin/provision-php.php
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_deploy_nic.py'
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://jks.ooo' }}
      - run: npm run test:build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  deploy-nic:
    if: vars.NIC_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: nic-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: nic-artifact
      - name: Extract tested static artifact
        run: |
          mkdir -p dist
          tar -xf nic-artifact/artifact.tar -C dist
      - name: Publish to the initialized NIC.RU webroot
        env:
          NIC_FTP_HOST: ${{ secrets.NIC_FTP_HOST }}
          NIC_FTP_USER: ${{ secrets.NIC_FTP_USER }}
          NIC_FTP_PASSWORD: ${{ secrets.NIC_FTP_PASSWORD }}
          NIC_FTP_TLS_NAME: ${{ secrets.NIC_FTP_TLS_NAME }}
        run: python3 scripts/deploy-nic.py --dist dist
